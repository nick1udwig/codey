name: Release agent service
on:
  release:
    types: [published]
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - run: go test ./...
      - name: Build release binaries and checksums
        shell: bash
        run: |
          mkdir -p dist
          for target in linux/amd64 linux/386 linux/arm linux/arm64 darwin/arm64; do
            export GOOS=${target%/*} GOARCH=${target#*/} CGO_ENABLED=0 GOARM=7
            go build -trimpath -ldflags='-s -w' -o "dist/codey-server-${GOOS}-${GOARCH}" ./cmd/codey-server
          done
          cp scripts/install.sh dist/install.sh
          cd dist
          sha256sum codey-server-* > SHA256SUMS
      - name: Attach assets to release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$RELEASE_TAG" dist/* --clobber
